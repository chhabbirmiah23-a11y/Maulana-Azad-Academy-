<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Portal | Maulana Azad Academy</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef8f4,#f7fbff);min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(440px,100%);background:#fff;padding:30px;border-radius:22px;box-shadow:0 15px 45px #0001}h1{text-align:center;color:#087455;margin-bottom:5px}p{text-align:center;color:#666}
label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #ccd8d3;border-radius:9px;font-size:16px;box-sizing:border-box}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#087455;color:white;font-weight:700;font-size:16px;cursor:pointer}.msg{text-align:center;margin-top:15px;color:#b42318;font-size:14px}
</style></head><body>
<main class="box"><h1>🔐 Login Portal</h1><p><b>MAULANA AZAD ACADEMY</b><br>Narai, Gangarampur, Dakshin Dinajpur</p>
<form id="form"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign In</button></form><div id="msg" class="msg"></div></main>
<script type="module">
import { login } from "./firebase-common.js";
const form=document.getElementById("form"), msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Signing in...";
try{await login(document.getElementById("email").value.trim(),document.getElementById("password").value)}
catch(err){msg.textContent=err.message==="NO_ROLE_PROFILE"||err.message==="INVALID_ROLE"?"Your account is not assigned a valid Academy role. Contact Admin.":"Incorrect email or password."}});
</script></body></html>
